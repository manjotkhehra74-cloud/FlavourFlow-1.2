version: 2.1

jobs:
  api-and-web:
    docker:
      - image: cimg/node:20.18
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - hrmate-npm-v1-{{ checksum "server/package-lock.json" }}
            - hrmate-npm-v1-
      - run:
          name: Install API dependencies
          command: cd server && npm ci
      - save_cache:
          key: hrmate-npm-v1-{{ checksum "server/package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Syntax check the API and the web console
          command: |
            cd server
            npm run check
            for file in $(find ../web/js -name '*.js'); do
              node --input-type=module --check < "$file" > /dev/null
            done
      - run:
          name: Boot the server and smoke test the API and console
          command: |
            cd server
            export DATABASE_PATH=./data/ci.sqlite JWT_SECRET=ci-only-secret PORT=3101
            node tools/seed-demo.js
            node src/index.js &
            for attempt in $(seq 1 30); do
              curl --silent --fail http://127.0.0.1:3101/health && break
              sleep 1
            done
            SMOKE_ADMIN_PHONE='+919000000001' SMOKE_ADMIN_PASSWORD='demo-password-123' \
              API_URL=http://127.0.0.1:3101/api/v1 bash tools/smoke-api.sh

  android-apk:
    docker:
      - image: cimg/android:2024.01
    resource_class: large
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - hrmate-pub-v1-{{ checksum "mobile/pubspec.yaml" }}
            - hrmate-pub-v1-
      - restore_cache:
          keys:
            - hrmate-gradle-v2-{{ checksum "mobile/pubspec.yaml" }}
            - hrmate-gradle-v2-
      - run:
          name: Install Android native build tools
          command: |
            sudo apt-get update
            sudo apt-get install -y ninja-build cmake
            yes | sdkmanager --licenses || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run:
          name: Install Flutter SDK
          command: |
            # Pin one current Flutter commit, compatible with the current plugin set.
            # Do not use the moving stable channel on future builds.
            if [ ! -d "$HOME/flutter/.git" ]; then
              git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
              git -C "$HOME/flutter" checkout --detach 6655482ec06e547f90abf8ae7590466f4415978d
            fi
            echo 'export PATH="$HOME/flutter/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            flutter --version
      - run:
          name: Prepare Android project and dependencies
          command: |
            source "$BASH_ENV"
            cd mobile
            # Always generate one native Android project from the pinned Flutter SDK.
            # This prevents old Groovy files and new Kotlin Gradle files from being mixed.
            rm -rf android
            flutter create --platforms=android --org com.gdfoods .
            rm -f test/widget_test.dart
            python3 tools/prepare_android.py
            printf '\norg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError\norg.gradle.workers.max=2\nkotlin.daemon.jvmargs=-Xmx512m\n' >> android/gradle.properties
            flutter pub get
            dart run flutter_launcher_icons
      - run:
          name: Keep CircleCI output alive
          background: true
          command: while true; do echo "HRMate Android build heartbeat $(date -u +%H:%M:%S)"; sleep 55; done
      - run:
          name: Analyze, test, and build release APK
          no_output_timeout: 75m
          command: |
            source "$BASH_ENV"
            cd mobile
            flutter analyze --no-fatal-infos
            flutter test
            flutter build apk --release
      - save_cache:
          key: hrmate-pub-v1-{{ checksum "mobile/pubspec.yaml" }}
          paths:
            - ~/.pub-cache
      - save_cache:
          key: hrmate-gradle-v2-{{ checksum "mobile/pubspec.yaml" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
      - store_artifacts:
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          destination: HRMate.apk

workflows:
  verify:
    jobs:
      - api-and-web
  build-android:
    jobs:
      - android-apk
